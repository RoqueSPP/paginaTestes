<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/styles.css" />
  <meta name="description" content="FORMULÁRIOS COM HTML, CSS & JS!">
  <meta name="keywords"
    content="HTML, CSS, FORMULÁRIOS, JavaScript, Playwright, Cypress, Robot, Codeceptjs, Appium, Selenium, Pactum, Postman">
  <title>Pagina de testes</title>
  <h1>Página de Testes</h1>
</head>
<style>
  /* ==========================================================
   Página de Testes — tema dark
   Salve em: css/styles.css
   ========================================================== */

  :root {
    --bg: #0f1420;
    --surface: #171e2e;
    --surface-2: #1f2840;
    --border: #2e3a57;
    --text: #e6eaf2;
    --text-muted: #9aa6bf;
    --accent: #6cb6ff;
    --accent-strong: #8fc9ff;
    --on-accent: #0b1220;
    --danger: #ff6b6b;
    --radius: 10px;

    color-scheme: dark;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    background: var(--bg);
  }

  body {
    margin: 0;
    padding: 2rem 1rem 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }

  h1 {
    max-width: 880px;
    width: 100%;
    margin: 0 auto 1.5rem;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  /* ---------- Formulário ---------- */

  form {
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
  }

  fieldset {
    margin: 0 0 1.5rem;
    padding: 1.25rem 1.5rem 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  legend {
    padding: 0 0.6rem;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent);
  }

  .two-col {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem 1.25rem;
  }

  label {
    display: block;
    margin-bottom: 0.3rem;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-muted);
  }

  /* Campos do endereço (fora do .two-col) */
  fieldset>form>label,
  fieldset>label {
    margin-top: 1rem;
  }

  fieldset>form>label:first-child,
  fieldset>label:first-child {
    margin-top: 0;
  }

  /* ---------- Campos ---------- */

  input,
  select {
    width: 100%;
    padding: 0.65rem 0.8rem;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input::placeholder {
    color: #6f7b96;
  }

  input:hover:not(:disabled),
  select:hover {
    border-color: #44547a;
  }

  input:focus-visible,
  select:focus-visible,
  button:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108, 182, 255, 0.3);
  }

  input:disabled {
    background: #141a29;
    color: var(--text-muted);
    border-style: dashed;
    cursor: not-allowed;
    opacity: 0.85;
  }

  select option {
    background: var(--surface-2);
    color: var(--text);
  }

  /* Remove as setas dos campos numéricos (opcional) */
  input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* Ícone do calendário legível no tema escuro */
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.8);
    cursor: pointer;
  }

  /* Preenchimento automático do navegador */
  input:-webkit-autofill {
    -webkit-text-fill-color: var(--text);
    box-shadow: 0 0 0 1000px var(--surface-2) inset;
    caret-color: var(--text);
  }

  /* ---------- Mensagem de erro ---------- */

  .error {
    min-height: 1.4em;
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: var(--danger);
  }

  /* ---------- Botão ---------- */

  button {
    display: block;
    width: 100%;
    margin: 0.5rem 0 1.5rem;
    padding: 0.85rem 1.25rem;
    background: var(--accent);
    color: var(--on-accent);
    border: 0;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover {
    background: var(--accent-strong);
  }

  button:active {
    transform: translateY(1px);
  }

  /* ---------- Rodapé ---------- */

  footer {
    margin-top: auto;
    padding: 1.5rem 0;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }

  /* ---------- Responsivo ---------- */

  @media (max-width: 640px) {
    body {
      padding: 1.25rem 0.75rem 0;
    }

    h1 {
      font-size: 1.5rem;
    }

    fieldset {
      padding: 1rem;
    }

    .two-col {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }

  /* ---------- Login ---------- */

  body:not(.autenticado)>:not(#login):not(script) {
    display: none !important;
  }

  body.autenticado #login {
    display: none;
  }

  #login {
    width: 100%;
    max-width: 420px;
    margin: 8vh auto 0;
    padding: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  #login h2 {
    margin: 0 0 1.25rem;
    font-size: 1.4rem;
    color: var(--accent);
  }

  #login label {
    margin-top: 1rem;
  }

  #login label:first-of-type {
    margin-top: 0;
  }

  #login button {
    margin: 1.25rem 0 0;
  }
</style>


<body>

  <form id="login" autocomplete="off">
    <h2>Login</h2>
    <label for="loginUser">Usuário</label>
    <input type="text" id="loginUser" name="loginUser" placeholder="Insert your user" required>

    <label for="loginPassword">Senha</label>
    <input type="password" id="loginPassword" name="loginPassword" placeholder="Insert your password" required>

    <div id="loginMsg" class="error" role="alert"></div>
    <button type="submit" id="btnLogin">Entrar</button>
  </form>

  <form>
    <fieldset>
      <legend>Basic Information</legend>
      <div class="two-col">
        <div>
          <label for="firstname">Primeiro Nome</label>
          <input type="text" id="firstname" placeholder="Insert your full name" required>
        </div>
        <div>
          <label for="lastname">Ultimo Nome</label>
          <input type="text" id="lastname" placeholder="Insert your last name" required>
        </div>
        <div>
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Insert your password" required>
        </div>
        <div>
          <label for="age">Idade</label>
          <input type="number" id="age" placeholder="Insert your age" required>
        </div>
        <div>
          <label for="birth">Data de Nascimento</label>
          <input type="date" id="birth" required>
        </div>
        <div>
          <label for="height">Altura</label>
          <input type="text" id="height" placeholder="Insert your height" required>
        </div>
        <div>
          <label for="peso">Peso</label>
          <input type="text" id="peso" placeholder="Insert your weight" required>
        </div>
        <div>
          <label for="blood">Tipo Sanguineo</label>
          <input type="text" id="blood" placeholder="Insert your blood type" required>
        </div>
        <div>
          <label for="skin">Cor de Pele</label>
          <input type="text" id="skin" placeholder="Insert your skin color" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Informações Pessoais</legend>
      <div class="two-col">
        <div>
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required>
          <div id="cpfMsg" class="error"></div>
        </div>
        <div>
          <label for="rg">RG</label>
          <input type="text" id="rg" placeholder="00.000.000-0" maxlength="12" required>
          <div id="rgMsg" class="error"></div>
        </div>
        <div>
          <label for="phone">Telefone</label>
          <input type="number" id="phone" placeholder="Insert your phone" required>
        </div>
        <div>
          <label for="mobile">Celular</label>
          <input type="tel" id="mobile" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric" required>
          <div id="mobileMsg" class="error"></div>
        </div>
        <div>
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="Insert your best email" required>
        </div>
        <div>
          <label for="mather">Nome da Mãe</label>
          <input type="text" id="mather" placeholder="Mother full name" required>
        </div>
        <div>
          <label for="father">Nome do Pai</label>
          <input type="text" id="father" placeholder="Father full name" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Outras Informações</legend>
      <div class="two-col">
        <div>
          <label for="select1">Sexo</label>
          <select id="select1">
            <option>--Select--</option>
            <option value="male">Masculino</option>
            <option value="female">Feminino</option>
            <option value="noreply">Prefiro não Responder</option>
          </select>
        </div>
        <div>
          <label for="select2">Signo</label>
          <select id="select2">
            <option>--Select--</option>
            <option>Aries</option>
            <option>Touro</option>
            <option>Gêmeos</option>
            <option>Cancer</option>
            <option>Leão</option>
            <option>Virgem</option>
            <option>Libra</option>
            <option>Escorpião</option>
            <option>Sargitário</option>
            <option>Capricornio</option>
            <option>Aquario</option>
            <option>Peixes</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <form>
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000" autocomplete="postal-code">

        <label for="logradouro">Endereço</label>
        <input type="text" disabled id="logradouro" name="logradouro" placeholder="Rua, Avenida, etc.">

        <label for="Numero">Número</label>
        <input type="text" id="numero" name="numero" placeholder="Número da residência" required>

        <label for="bairro">Bairro</label>
        <input type="text" disabled id="bairro" name="bairro">

        <label for="cidade">Cidade</label>
        <input type="text" disabled id="cidade" name="cidade">

        <label for="uf">Estado (UF)</label>
        <input type="text" disabled id="uf" name="uf" maxlength="2">

        <div id="mensagem" class="error"></div>
      </form>
      <button type="button" id="btnValidate" onclick="validarFormulario()">
        Validar Preenchimento
      </button>
  </form>
  </fieldset>
  <script>
    const cep = document.querySelector("#cep");
    const logradouro = document.querySelector("#logradouro");
    const bairro = document.querySelector("#bairro");
    const cidade = document.querySelector("#cidade");
    const uf = document.querySelector("#uf");
    const mensagem = document.querySelector("#mensagem");

    // Máscara do CEP: 00000-000
    cep.addEventListener("input", () => {
      let v = cep.value.replace(/\D/g, "").slice(0, 8);
      if (v.length > 5) v = v.slice(0, 5) + "-" + v.slice(5);
      cep.value = v;

      // Quando o usuário termina de digitar (8 dígitos), busca automaticamente
      if (v.length === 9) {
        buscarCEP(v.replace("-", ""));
      }
    });

    function buscarCEP(cepNumerico) {
      mensagem.textContent = "";
      fetch(`https://viacep.com.br/ws/${cepNumerico}/json/`)
        .then(resp => {
          if (!resp.ok) throw new Error("Erro ao consultar o CEP");
          return resp.json();
        })
        .then(data => {
          if (data.erro) {
            limparCampos();
            mensagem.textContent = "CEP não encontrado.";
          } else {
            logradouro.value = data.logradouro || "";
            bairro.value = data.bairro || "";
            cidade.value = data.localidade || "";
            uf.value = data.uf || "";
          }
        })
        .catch(() => {
          limparCampos();
          mensagem.textContent = "Erro ao buscar o CEP.";
        });
    }

    function limparCampos() {
      logradouro.value = "";
      bairro.value = "";
      cidade.value = "";
      uf.value = "";
    }
  </script>
  <script>
    // ---------- Validação de CPF ----------
    function validarCPF(cpf) {
      cpf = cpf.replace(/\D/g, "");
      // 11 dígitos e não pode ser sequência repetida (111.111.111-11 etc.)
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;

      for (let t = 9; t < 11; t++) {
        let soma = 0;
        for (let i = 0; i < t; i++) soma += cpf[i] * (t + 1 - i);
        const dv = ((soma * 10) % 11) % 10;
        if (dv != cpf[t]) return false;
      }
      return true;
    }

    const cpfInput = document.querySelector("#cpf");
    const cpfMsg = document.querySelector("#cpfMsg");

    // Máscara: 000.000.000-00
    cpfInput.addEventListener("input", () => {
      let v = cpfInput.value.replace(/\D/g, "").slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      cpfInput.value = v;
      cpfInput.style.border = "";
      cpfMsg.textContent = "";
    });

    // Valida ao sair do campo
    cpfInput.addEventListener("blur", () => {
      if (cpfInput.value && !validarCPF(cpfInput.value)) {
        cpfMsg.textContent = "CPF inválido.";
        cpfInput.style.border = "2px solid red";
      }
    });
    const rgInput = document.querySelector("#rg");
    const rgMsg = document.querySelector("#rgMsg");

    // Máscara: 00.000.000-0 (aceita 'X' no último dígito)
    rgInput.addEventListener("input", () => {
      let v = rgInput.value.toUpperCase().replace(/[^0-9X]/g, "");

      // Garante que o 'X' só seja aceito na 9ª posição (dígito verificador)
      if (v.length > 1) {
        v = v.slice(0, 8).replace(/\D/g, "") + v.slice(8, 9);
      } else {
        v = v.replace(/\D/g, "");
      }

      v = v.replace(/(\d{2})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})([\dX]{1})$/, "$1-$2");

      rgInput.value = v;
      rgInput.style.border = "";
      rgMsg.textContent = "";
    });

    document.addEventListener("DOMContentLoaded", () => {
      const mobileInput = document.querySelector("#mobile");
      const mobileMsg = document.querySelector("#mobileMsg");

      if (!mobileInput) {
        console.error("Campo #mobile não encontrado no HTML!");
        return;
      }

      mobileInput.addEventListener("input", () => {
        let v = mobileInput.value.replace(/\D/g, "").slice(0, 11);

        if (v.length > 10) {
          v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
        } else if (v.length > 6) {
          v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3");
        } else if (v.length > 2) {
          v = v.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
        } else if (v.length > 0) {
          v = v.replace(/^(\d*)$/, "($1");
        }

        mobileInput.value = v;
      });
    });

    // ---------- Validação do formulário ----------
    function validarFormulario() {
      const camposObrigatorios = document.querySelectorAll(
        'input[required], select'
      );
      let formularioValido = true;
      let camposInvalidos = [];

      camposObrigatorios.forEach(campo => {
        if (
          campo.tagName === "SELECT" &&
          (campo.value === "" || campo.value === "--Select--")
        ) {
          formularioValido = false;
          camposInvalidos.push(campo);
        } else if (campo.tagName === "INPUT" && campo.value.trim() === "") {
          formularioValido = false;
          camposInvalidos.push(campo);
        }
      });

      // CPF precisa ser válido (dígitos verificadores)
      if (!validarCPF(cpfInput.value)) {
        formularioValido = false;
        if (!camposInvalidos.includes(cpfInput)) camposInvalidos.push(cpfInput);
        cpfMsg.textContent = "CPF inválido.";
      }

      if (!formularioValido) {
        alert("Por favor, preencha todos os campos obrigatórios corretamente.");
        // Destaque visual (opcional)
        camposInvalidos.forEach(campo => {
          campo.style.border = "2px solid red";
        });
      } else {
        // Redireciona se tudo estiver OK
        window.location.href = "https://testefeito.vercel.app/";
      }
    }


  </script>
  <footer>
    &copy; 2025 - Página de Testes | Desenvolvido por Roque
  </footer>

  <script>
    // ---------- Login ----------
    const LOGIN_USER = "desafioDeTeste";
    const LOGIN_PASS = "QaTester2026";

    document.querySelector("#login").addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.querySelector("#loginUser").value;
      const pass = document.querySelector("#loginPassword").value;
      const msg = document.querySelector("#loginMsg");

      if (user === LOGIN_USER && pass === LOGIN_PASS) {
        msg.textContent = "";
        document.body.classList.add("autenticado");
      } else {
        msg.textContent = "Usuário ou senha inválidos.";
      }
    });
  </script>
</body>

</html>
